{{if .Entries}}
<h3>関連エントリー</h3>
{{range .Entries}}
<ul>
	<li data-id="{{.ID}}">
		<a href="/{{.Path}}" data-score="{{printf "%f" .Score}}">
			<b>
				{{.DisplayTitle}}
			</b>
			<time datetime="{{.CreatedAt.Format "2006-01-02T15:04:05Z"}}" itemprop="datePublished">
				<relative-time epoch="{{.CreatedAt.Unix}}">{{.CreatedAt.Format "15:04"}}</relative-time>
			</time>
			<span class="summary">{{summary .FormattedBody 200}}</span>
		</a>
	</li>
</ul>
{{end}}
{{end}}
