{{if .Entries}}
<h3>関連エントリー</h3>
{{range .Entries}}
<ul>
	<li data-id="{{.ID}}">
		<a href="/{{.Path}}" data-score="{{printf "%f" .Score}}">
			<em>
				{{.DisplayTitle}}
			</em>
			<time datetime="{{.CreatedAtRFC3339}}" itemprop="datePublished">
				<relative-time epoch="{{.CreatedAt.Unix}}">{{.DisplayTime}}</relative-time>
			</time>
			<span class="summary">{{.Summary}}</span>
		</a>
	</li>
</ul>
{{end}}
{{end}}
