{{define "content"}}
<section id="archive">
	{{range .Archives}}
		<section class="year">
			<h1>{{.Year}}年</h1>
			<ol class="months">
				{{range .Months}}
					<li class="month">
						<a href="/{{.Year}}/{{.Month}}/" title="{{.Count}}">
							{{.Month}}月
						</a>
					</li>
				{{end}}
			</ol>
		</section>
	{{end}}
</section>
{{end}}
