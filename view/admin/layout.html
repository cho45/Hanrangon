---
links = [
  { url = "/static/admin/admin-frontend.css", rel = "preload", as = "style" },
  { url = "/static/admin/admin-front.js", rel = "modulepreload" }
]
---
<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
	<title>{{if .PageTitle}}{{.PageTitle}} - {{end}}Hanrangon Admin</title>
	{{if .SessionKey}}
	<meta name="csrf-token" content="{{.SessionKey}}"/>
	{{end}}
	<link rel="icon" href="/images/favicon.ico" sizes="32x32"/>
	<link rel="icon" href="/images/icon.svg" type="image/svg+xml"/>
	<link rel="apple-touch-icon" href="/images/apple-touch-icon.png"/>
	<link rel="manifest" href="/images/manifest.webmanifest"/>
	{{ if env "HANRANGON_FE_DEV" }}
	<script type="module" src="http://localhost:5173/@vite/client"></script>
	<script type="module" src="http://localhost:5173/src/main.ts"></script>
	{{ else }}
	<link rel="stylesheet" href="/static/admin/admin-frontend.css"/>
	<script type="module" src="/static/admin/admin-front.js"></script>
	{{ end }}
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			background-color: #f7f8f9;
			margin: 0;
			height: 100vh;
		}
		#admin-root {
			height: 100%;
			display: flex;
			flex-direction: column;
		}
		/* Loading spinner from edit.html */
		@-webkit-keyframes spin{
			0%{-webkit-transform: rotate(0deg);}
			100%{-webkit-transform: rotate(1080deg);}
		}
		@keyframes spin{
			0%{transform: rotate(0deg);}
			100%{transform: rotate(1080deg);}
		}
		.loading{
			box-sizing: border-box;
			display: block;
			width: 36px;
			height: 36px;
			margin: 100px auto;
			border-width: 4px;
			border-style: solid;
			border-color: transparent #000;
			border-radius: 18px;
			animation: spin 2s ease-in-out infinite;
		}
	</style>
</head>
<body>
	<div id="admin-root">
		<div class="loading"></div>
	</div>
</body>
</html>
