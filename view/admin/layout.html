<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
	<title>{{if .PageTitle}}{{.PageTitle}} - {{end}}Hanrangon Admin</title>
	<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon"/>
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			background-color: #f7f8f9;
			margin: 0;
			display: flex;
			flex-direction: column;
			height: 100vh;
		}
		header {
			background: #333;
			color: white;
			padding: 0.5rem 1rem;
			display: flex;
			justify-content: space-between;
			align-items: center;
			flex-shrink: 0;
			font-size: 12px;
		}
		header h1 {
			margin: 0;
			font-size: 1.2rem;
		}
		header a {
			color: white;
			text-decoration: none;
		}
		nav ul {
			list-style: none;
			padding: 0;
			margin: 0;
			display: flex;
			gap: 1rem;
		}
		main {
			flex: 1;
			min-height: 0;
			display: flex;
			flex-direction: column;
		}
		/* Loading spinner from edit.html */
		@-webkit-keyframes spin{
			0%{-webkit-transform: rotate(0deg);}
			100%{-webkit-transform: rotate(1080deg);}
		}
		@keyframes spin{
			0%{transform: rotate(0deg);}
			100%{transform: rotate(1080deg);}
		}
		.loading{
			box-sizing: border-box;
			display: block;
			width: 36px;
			height: 36px;
			margin: 100px auto;
			border-width: 4px;
			border-style: solid;
			border-color: transparent #000;
			border-radius: 18px;
			animation: spin 2s ease-in-out infinite;
		}
	</style>
</head>
<body>
	<header>
		<h1><a href="/admin/">Hanrangon Admin</a></h1>
		<nav>
			<ul>
				<li><a href="/edit">新規作成</a></li>
				<li><a href="/">サイト確認</a></li>
				<li><a href="/logout">ログアウト</a></li>
			</ul>
		</nav>
	</header>

	<main>
		{{template "content" .}}
	</main>
</body>
</html>
