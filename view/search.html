{{define "head"}}
<style>
	.search-container {
		max-width: 800px;
		margin: 20px auto;
		padding: 0 20px;
	}
	.search-form {
		display: flex;
		gap: 10px;
		margin-bottom: 30px;
	}
	.search-form input[type="search"] {
		flex: 1;
		padding: 10px;
		font-size: 1.1rem;
		border: 1px solid #dfe5e7;
		border-radius: 4px;
	}
	.search-form button {
		padding: 10px 20px;
		background: #00acc1;
		color: #fff;
		border: none;
		border-radius: 4px;
		cursor: pointer;
		font-size: 1rem;
	}
	.search-result-item {
		margin-bottom: 20px;
		padding-bottom: 15px;
		border-bottom: 1px solid #eee;
	}
	.search-result-item h3 {
		margin: 0 0 5px 0;
		font-size: 1.2rem;
	}
	.search-result-item .summary {
		font-size: 0.95rem;
		color: #333;
		margin-bottom: 8px;
		line-height: 1.5;
	}
	.search-result-item .meta {
		font-size: 0.85rem;
		color: #666;
		display: flex;
		gap: 15px;
	}
	.search-result-item .score {
		color: #00acc1;
		font-weight: bold;
	}
	.loading-spinner {
		text-align: center;
		padding: 40px;
		display: none;
	}
	.no-results {
		text-align: center;
		padding: 40px;
		color: #666;
		display: none;
	}
</style>
{{end}}

{{define "content"}}
<div class="search-container">
	<h2>検索</h2>
	<form class="search-form" id="search-form" action="/search" method="GET">
		<input type="search" name="q" id="search-input" placeholder="キーワードを入力..." required autofocus>
		<button type="submit">検索</button>
	</form>

	<div id="search-status">
		<div class="loading-spinner" id="loading-spinner">検索中...</div>
		<div class="no-results" id="no-results">該当する記事が見つかりませんでした。</div>
	</div>

	<div id="search-results">
		<!-- Results will be injected here -->
	</div>
</div>

<script type="module" src="/js/search.js"></script>
{{end}}
