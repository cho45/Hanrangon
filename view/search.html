{{define "head"}}
<meta name="robots" content="noindex, nofollow">
<style>
	.search-container {
		max-width: var(--container-width);
		margin: 0 auto;
		padding: 0 1.5rem;
	}
	.search-form {
		display: flex;
		gap: 10px;
		margin-bottom: 30px;
		position: sticky;
		top: 0;
		background: var(--bg-color);
		padding: 1.5rem 0;
		z-index: 10;
		border-bottom: 1px solid var(--border-color);
	}
	.search-form input[type="search"] {
		flex: 1;
		padding: 0.75rem 1rem;
		font-size: 1rem;
		border: 1px solid var(--border-color);
		border-radius: 2px;
		background: var(--code-bg);
		color: var(--text-color);
		font-family: inherit;
		outline: none;
		transition: border-color 0.2s;
	}
	.search-form input[type="search"]:focus {
		border-color: var(--link-color);
	}
	.search-form button {
		padding: 0.75rem 1.5rem;
		background: var(--link-color);
		color: #fff;
		border: none;
		border-radius: 2px;
		cursor: pointer;
		font-size: 0.9rem;
		font-weight: 500;
		transition: opacity 0.2s;
	}
	.search-form button:hover {
		opacity: 0.8;
	}
	.search-result-item {
		margin-bottom: 2.5rem;
		padding-bottom: 1.5rem;
		border-bottom: 1px solid var(--border-color);
	}
	.search-result-item h3 {
		margin: 0 0 0.5rem 0;
		font-size: 1.25rem;
		display: flex;
		flex-wrap: wrap;
		gap: 8px;
		align-items: center;
		font-family: 'Noto Serif JP', serif;
	}
	.search-result-item h3 a {
		text-decoration: none;
		color: var(--text-color);
	}
	.search-result-item h3 a:hover {
		color: var(--link-color);
		text-decoration: underline;
	}
	.search-result-item .tag {
		background: var(--code-bg);
		color: var(--accent-color);
		font-size: 0.7rem;
		padding: 1px 6px;
		border-radius: 2px;
		border: 1px solid var(--border-color);
		font-weight: normal;
		font-family: sans-serif;
	}
	.search-result-item .summary {
		font-size: 0.9rem;
		color: var(--text-color);
		margin-bottom: 0.5rem;
		line-height: 1.6;
	}
	.search-result-item .meta {
		font-size: 0.75rem;
		color: var(--accent-color);
		display: flex;
		gap: 15px;
		font-family: sans-serif;
	}
	.search-result-item .score {
		opacity: 0.5;
	}
	mark {
		background: #eee;
		color: #000;
		padding: 0 1px;
		border-radius: 1px;
		font-weight: bold;
	}
	.loading-spinner {
		text-align: center;
		padding: 40px;
		display: none;
	}
	.no-results {
		text-align: center;
		padding: 40px;
		color: #666;
		display: none;
	}
	.visually-hidden {
		position: absolute;
		width: 1px;
		height: 1px;
		padding: 0;
		margin: -1px;
		overflow: hidden;
		clip: rect(0, 0, 0, 0);
		white-space: nowrap;
		border: 0;
	}
</style>
{{end}}

{{define "content"}}
<div class="search-container">
	<h2>検索</h2>
	<form class="search-form" id="search-form" action="/search" method="GET" role="search">
		<input type="search" name="q" id="search-input" placeholder="キーワードを入力..." aria-label="検索キーワード" required autofocus>
		<button type="submit">検索</button>
	</form>

	<div id="search-status">
		<div class="loading-spinner" id="loading-spinner">検索中...</div>
		<div class="no-results" id="no-results">該当する記事は見つかりませんでした。</div>
		<div class="visually-hidden" id="aria-status" aria-live="polite"></div>
	</div>

	<div id="search-results" role="list">
		<!-- Results will be injected here -->
	</div>
</div>

<script type="module" src="/js/search.js"></script>
{{end}}
