version: "2"
sql:
  - schema: "backend/db/schema"
    queries: "backend/db/query"
    engine: "sqlite"
    gen:
      go:
        package: "model"
        out: "backend/model"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - db_type: "DATE"
            go_type: "string"
