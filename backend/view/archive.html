<section id="archive">
	{{range .Archives}}
		<section class="year">
			<h2>{{.Year}}年</h2>
			<ol class="months">
				{{range .Months}}
					<li class="month{{if eq .Count 0}} empty{{end}}">
						{{if gt .Count 0}}
							<a href="/{{.Year}}/{{.Month}}/" title="{{.Count}}">
								{{.Month}}月
							</a>
						{{else}}
							{{.Month}}月
						{{end}}
					</li>
				{{end}}
			</ol>
		</section>
	{{end}}
	<hr>
</section>
