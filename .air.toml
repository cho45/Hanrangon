root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
bin = "./hanrangon"
cmd = "make build-be"
delay = 1000
exclude_dir = ["admin-frontend", "static/admin", "var", "tmp", "vendor", ".git", "postprocess/node_modules"]
exclude_file = []
exclude_regex = ["_test.go"]
exclude_unchanged = false
follow_symlink = false
  full_bin = "HANRANGON_FE_DEV=true ./hanrangon"

include_dir = []
include_ext = ["go", "tpl", "tmpl", "html", "toml"]
kill_delay = "0s"
log = "build-errors.log"
send_interrupt = true
stop_on_error = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
time = false

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false